name: Weekly verify

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Re-verify every asset
        id: verify
        continue-on-error: true
        run: python tools/validate.py --verify --report failures.md
      - name: Look for newer upstream releases
        run: python tools/check_updates.py --out updates.md
      - name: Open or update the issue
        run: |
          if [ ! -s failures.md ] && [ ! -s updates.md ]; then
            echo "All assets verified, nothing newer upstream."
            exit 0
          fi
          {
            echo "Weekly check on $(date -u +%Y-%m-%d)."
            if [ -s failures.md ]; then printf '\n### Failing assets\n\n'; cat failures.md; fi
            if [ -s updates.md ]; then printf '\n### Newer upstream releases\n\n'; cat updates.md; fi
          } > body.md
          title="Weekly check: failing assets and updates"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
